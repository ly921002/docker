# docker-compose.yml —— docker-empty:box64（免特权：显式 box64 跑 x86_64）
# ----------------------------------------------------------------------------
# 镜像：ghcr.io/ly921002/docker-empty:box64（ubuntu:22.04 arm64 + box64/box32）。
# 方式：免特权、不注册 binfmt；x86_64 程序用【显式】box64 调用运行：
#           box64 <x86_64程序> [参数...]
#       box64 已装在镜像 PATH 中，纯用户态翻译，无需 privileged、无需动内核 binfmt。
#
# 用法：
#   docker login ghcr.io                 # 镜像私有；同源 GitHub 账号可拉
#   docker compose up -d                 # 构建(如需)并常驻运行
#   docker exec -it box64 bash           # 进容器
#   # 容器内显式跑 x86_64 程序：
#   box64 ./steamcmd                     # 例：经 box64 运行 x86_64 steamcmd
#   # 也可不进交互 shell，直接：
#   docker exec box64 box64 /root/steamcmd/steamcmd +quit
#   docker compose down                  # 停止
#
# 说明：
#   - 仅 arm64 宿主有效；x86_64 宿主原生跑 x86_64，无需 box64。
#   - 【动态链接】的 x86_64 程序（如 SteamCMD）还需 x86_64 运行库；本镜像未内置，需在容器内：
#       dpkg --add-architecture amd64 && apt-get update && apt-get install -y \
#         libc6:amd64 libstdc++6:amd64 libgcc-s1:amd64 zlib1g:amd64
#     （可参考 ly921002/box64-arm64-deb；或让我把这些库固化进 Dockerfile）。
#     静态链接的 x86_64 程序开箱即用。
#   - 想要「直接 ./程序」透明运行（不用每次加 box64 前缀）？那需要容器内注册 binfmt +
#     privileged，属于另一种方式，可参考 ly921002/gsm-box64 的 start-x64.sh。
# ----------------------------------------------------------------------------

services:
  box64:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    image: ghcr.io/ly921002/docker-empty:box64
    container_name: box64
    restart: unless-stopped
    stdin_open: true            # 便于 docker exec -it / attach
    tty: true
    # 常驻即可；x86_64 程序通过 docker exec ... box64 <程序> 显式运行
    command: ["sleep", "infinity"]
